# 吃.env的資料
spring.config.import=optional:file:.env[.properties]

# 設定db連線
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:${TEST_DB_PORT}/${TEST_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# 啟用 Flyway , Spring Boot 啟動時會自動跑 migration
spring.flyway.enabled=true
# 指定 migration SQL 放在哪裡, migration 正式測試都是吃一樣檔案, 但是測試資料會另外放在test/resources/db/testdata
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
spring.flyway.baseline-on-migrate=true

# Hibernate 驗證
spring.jpa.hibernate.ddl-auto=validate
# 把 Hibernate 執行的 SQL 印到 console
spring.jpa.show-sql=true
# 把印出來的 SQL 排版，變得比較好讀
spring.jpa.properties.hibernate.format_sql=true

# 測試修正步驟 1：提供 MailSender 自動設定所需的 SMTP 主機名稱。
# 原因：測試環境不會讀取 main 的 Gmail 設定；未提供 host 時 Spring Boot 不會建立 JavaMailSender，
# 而 BookController 注入 MailService 時就會因找不到 JavaMailSender Bean 而無法啟動 ApplicationContext。
# localhost 只用來建立寄信元件，測試本身不會呼叫寄信 API，因此不會真的連線或寄出 Email。
spring.mail.host=localhost

# 測試修正步驟 2：提供測試用的寄件帳號與書籍通知收件者。
# 原因：MailService 會從 spring.mail.username 取得 From，並以 book.notification.email 決定系統通知收件者；
# 使用保留的 example.test 網域可避免測試設定混入真實 Gmail 帳號或密碼。
spring.mail.username=no-reply@example.test
book.notification.email=book-admin@example.test
