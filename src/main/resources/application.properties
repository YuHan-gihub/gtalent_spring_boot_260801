spring.application.name=gtalent_spring_boot_260801

# 吃.env的資料
spring.config.import=optional:file:.env[.properties]

# 設定db連線
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 啟用 Flyway , Spring Boot 啟動時會自動跑 migration
spring.flyway.enabled=true
# 指定 migration SQL 放在哪裡
spring.flyway.locations=classpath:db/migration,classpath:db/seeder
spring.flyway.baseline-on-migrate=true

# Hibernate 驗證
spring.jpa.hibernate.ddl-auto=validate
# 把 Hibernate 執行的 SQL 印到 console
spring.jpa.show-sql=true
# 把印出來的 SQL 排版，變得比較好讀
spring.jpa.properties.hibernate.format_sql=true

# Gmail 設定
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}

# 改寫步驟 20：設定書籍新增、修改、刪除通知的收件者；未設定時寄給 Gmail 寄件帳號。
# 原因：正式環境可在 .env 設定 BOOK_NOTIFICATION_EMAIL 給管理者，而本機練習即使未設定也能寄回 GMAIL_USERNAME。
book.notification.email=${BOOK_NOTIFICATION_EMAIL:${GMAIL_USERNAME}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# jwt 設定
jwt.secret=${JWT_SECRET}
jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS}
jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS}

# password reset
app.base-url=${APP_BASE_URL}
member.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES}

# newebpay
newebpay.merchant-id=${NEWEBPAY_MERCHANT_ID}
newebpay.hash-key=${NEWEBPAY_HASH_KEY}
newebpay.hash-iv=${NEWEBPAY_HASH_IV}
newebpay.version=${NEWEBPAY_VERSION}
newebpay.gateway-url=${NEWEBPAY_GATEWAY_URL}
newebpay.notify-url=${NEWEBPAY_NOTIFY_URL}
newebpay.return-url=${NEWEBPAY_RETURN_URL}

# LINE Messaging API / Webhook
line.bot.channel-token=${LINE_CHANNEL_ACCESS_TOKEN}
line.bot.channel-secret=${LINE_CHANNEL_SECRET}
line.bot.handler.path=/api/line/webhook

# LINE LIFF
line.liff.id=${LIFF_ID}